<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox-backdrop"></div>
  <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="Page preview">
    <div class="lightbox-head">
      <span class="lightbox-title" id="lbTitle"></span>
      <div class="lightbox-tools">
        <button type="button" class="ghost" id="lbRotate" title="Rotate this page 90&deg; anticlockwise">&#8635; Rotate</button>
        <button type="button" class="ghost" id="lbClose" title="Close (Esc)">&times; Close</button>
      </div>
    </div>
    <div class="lightbox-body">
      <button type="button" class="lbnav lbprev" id="lbPrev" title="Previous page (&larr;)">&#8249;</button>
      <img id="lbImg" alt="">
      <button type="button" class="lbnav lbnext" id="lbNext" title="Next page (&rarr;)">&#8250;</button>
    </div>
    <div class="lightbox-foot"><span id="lbPageLabel"></span></div>
  </div>
</div>
